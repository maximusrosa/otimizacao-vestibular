services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    shm_size: "256mb"
    environment:
      RANKING_DB_PATH: /app/runtime/rankings.db
      RANKING_SYNC_ENABLED: ${RANKING_SYNC_ENABLED:-false}
      RANKING_SYNC_YEARS: ${RANKING_SYNC_YEARS:-2025}
      RANKING_SYNC_TIME: ${RANKING_SYNC_TIME:-05:00}
      TZ: America/Sao_Paulo
    volumes:
      - ranking-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 15s # first 15s: failures are ignored
      interval: 300s     # after that: check every 5 min
      timeout: 5s       # each check must respond within 5s
      retries: 1

  frontend:
    build: ./frontend
    ports:
      - "3000:80"   # host:container — container now uses 80 (nginx), not 3000
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  ranking-sync:
    build: ./backend
    command: ["python", "-m", "src.ranking_scheduler"]
    restart: unless-stopped
    shm_size: "256mb"
    environment:
      RANKING_DB_PATH: /app/runtime/rankings.db
      RANKING_SYNC_ENABLED: ${RANKING_SYNC_ENABLED:-false}
      RANKING_SYNC_YEARS: ${RANKING_SYNC_YEARS:-2025}
      RANKING_SYNC_TIME: ${RANKING_SYNC_TIME:-05:00}
      TZ: America/Sao_Paulo
    volumes:
      - ranking-runtime:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      start_period: 5s
      interval: 300s
      timeout: 5s
      retries: 1

volumes:
  ranking-runtime:
